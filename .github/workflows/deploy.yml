name: Build and deploy to Hostinger

# Every CMS save commits to main, so this is what publishes the site.
# Hostinger's shared hosting serves files but cannot run a Node build —
# and this project's build renders every PDF page with sharp + pdfjs — so
# the build happens here and only the finished dist/ is uploaded.
on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

# A CMS user saving three entries quickly would otherwise start three
# overlapping uploads racing each other onto the same directory.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Runs ingest → sync-industries → astro build → prune-dist.
        run: npm run build

      - name: Fail if the build produced no pages
        # A green build with an empty dist/ would silently wipe the live
        # site on upload. Cheap guard, catches the worst possible outcome.
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          count=$(find dist/work -maxdepth 1 -mindepth 1 -type d | wc -l)
          echo "Project pages built: $count"
          test "$count" -gt 0 || { echo "No project pages were built"; exit 1; }

      - name: Publish to Hostinger over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Keep files the site needs but the build does not produce.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
