# Sveltia CMS configuration — https://github.com/sveltia/sveltia-cms
#
# Sign-in options (pick one):
#   1. Open /admin/ on the live site → "Sign in with GitHub" → use a
#      fine-grained personal access token with Contents read/write on this
#      repo (Sveltia supports token sign-in without any OAuth server).
#   2. Or deploy the tiny sveltia-cms-auth Cloudflare Worker
#      (https://github.com/sveltia/sveltia-cms-auth) and add its URL here as
#      `base_url` for one-click OAuth sign-in.
#   3. Working locally? Run `npm run dev`, open localhost:4321/admin/ and
#      choose "Work with local repository" — no sign-in needed.
#
# Every save commits to `main`; the host rebuilds the site automatically.

backend:
  name: github
  repo: ezanbhutta/xstudioz-portfolio
  branch: main

site_url: https://xstudioz.vercel.app
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    format: json
    extension: json
    path: '{{slug}}/index'
    # Images uploaded in the editor live inside the project's own folder.
    media_folder: ''
    public_folder: ''
    create: true
    delete: true
    identifier_field: title
    slug: '{{slug}}'
    summary: '{{title}} — {{category}}'
    sortable_fields:
      fields: [order, year, title]
      default:
        field: order
    fields:
      - { name: title, label: Title, widget: string }
      - name: category
        label: Category
        widget: select
        # Keep in sync with src/data/categories.json (Site settings → Categories)
        options:
          - logo-design
          - brand-guidelines
          - stationery
          - social-media
          - animation
      - name: logoType
        label: Logo type
        widget: select
        required: false
        hint: Logo Design projects only. Powers the Type filter dropdown.
        # Keep in sync with src/data/filters.ts
        options:
          - Wordmark
          - Abstract
          - Pictorial
          - Combination
          - Mascot
          - Emblem
          - Lettermark
      - name: guidelineType
        label: Guidelines type
        widget: select
        required: false
        hint: Brand Guidelines projects only. Powers the Type filter dropdown.
        # Keep in sync with src/data/filters.ts
        options:
          - Short Brand Guidelines
          - Full Brand Guidelines
          - Premium Brand Guidelines
      - name: extras
        label: Extra elements
        widget: select
        multiple: true
        required: false
        hint: Anything included beyond the core sections. Listed on the project page, not a filter.
        # Keep in sync with src/data/filters.ts
        options:
          - Social Media Kit
          - Stationery Design Kit
          - Mockups
          - Apparel Design
          - Merchandise
          - Marketing Materials
      - name: extrasCustom
        label: Custom extra elements
        widget: list
        required: false
        hint: Add anything the list above does not cover, one item per row.
      - name: industry
        label: Industry
        widget: string
        required: false
        hint: 'e.g. Jewelry. Powers the Industry filter dropdown; new industries appear automatically.'
      - name: website
        label: Brand website
        widget: string
        required: false
        hint: 'Optional, e.g. brandname.com. Shown as a link on the project page only when filled.'
      - name: instagram
        label: Instagram
        widget: string
        required: false
        hint: 'Optional. Paste the profile link or just the username.'
      - name: facebook
        label: Facebook
        widget: string
        required: false
        hint: 'Optional. Paste the page link or just the username.'
      - name: linkedin
        label: LinkedIn
        widget: string
        required: false
        hint: 'Optional. Paste the company or profile link, or just the company name in the URL.'
      - name: otherLinks
        label: Other links
        widget: list
        required: false
        hint: 'Any other social or platform link, one per row (TikTok, Behance, X…). Only shown when filled.'
      - name: order
        label: Grid position
        widget: number
        value_type: int
        default: 99
        hint: Lower numbers appear earlier in the grid.
      - name: summary
        label: Details
        widget: text
        hint: A sentence or two about the project, shown under the brand name.
      - name: pdf
        label: Portfolio PDF
        widget: file
        required: false
        hint: 'Upload the presentation PDF and you are done: the next deploy renders every page and the grid thumbnail automatically. Skip the fields below.'
      - name: cover
        label: Grid thumbnail (only if not using a PDF)
        widget: image
        required: false
        hint: 4:3 image shown in the work grid. Leave empty when a PDF is uploaded.
      - name: coverAlt
        label: Thumbnail alt text
        widget: string
        required: false
        hint: Describe what the thumbnail shows. Leave empty when a PDF is uploaded.
      - name: images
        label: Portfolio images (only if not using a PDF)
        label_singular: Image
        widget: list
        required: false
        hint: The presentation as images, in order. Leave empty when a PDF is uploaded.
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt, label: Alt text, widget: string }

  - name: settings
    label: Site settings
    editor:
      preview: false
    files:
      - name: site
        label: Brand & links
        file: src/config/site.json
        fields:
          - { name: name, label: Studio name, widget: string }
          - name: url
            label: Production URL
            widget: string
            hint: 'No trailing slash, e.g. https://xstudioz.design — canonicals and sitemap derive from it.'
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Site description, widget: text }
          - name: fiverrUrl
            label: Fiverr profile URL
            widget: string
            hint: Every "Hire on Fiverr" button points here.
          - { name: locale, label: Locale, widget: string, default: en }
      - name: categories
        label: Categories
        file: src/data/categories.json
        fields:
          - name: categories
            label: Categories
            label_singular: Category
            widget: list
            fields:
              - name: id
                label: ID
                widget: string
                hint: URL segment, kebab-case (e.g. logo-design). Also add new ids to the Projects category options in public/admin/config.yml.
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
